name: Bug report
description: Something in UX Planner does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can, reproduce it with `ux-planner demo` so others can follow the same steps. Do not paste private planning documents.
      placeholder: |
        1. Run `node bin/ux-planner.mjs demo`
        2. Open the Getting started journey
        3. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Web app (localhost)
        - CLI (init, start, demo, export)
        - MCP server or MCP App
        - Landing site or /demo
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD` in your checkout.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, browser, and MCP client if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
