version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
